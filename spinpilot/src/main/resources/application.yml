server:
  port: 8443
  ssl:
    enabled: true
    certificate: /opt/certs/spinpilot-server.crt
    certificate-private-key: /opt/certs/spinpilot-server.key
    enabled-protocols: TLSv1.2,TLSv1.3

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://kc2.server2.localhost:8442/realms/keycloak2
          jwk-set-uri: https://kc2.server2.localhost:8442/realms/keycloak2/protocol/openid-connect/certs