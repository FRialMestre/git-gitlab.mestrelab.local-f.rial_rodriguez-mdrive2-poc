server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/mdrive
          jwk-set-uri: http://keycloak1:8080/realms/mdrive/protocol/openid-connect/certs