services:
  middleware:
    build: ./middleware
    ports:
      - "8085:8080"
    depends_on:
      keycloak1:
        condition: service_healthy

  spinpilot:
    build: ./spinpilot
    ports:
      - "8084:8080"
    depends_on:
      keycloak2:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8083:8080"
    depends_on:
      middleware:
        condition: service_started
      keycloak1:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "5173:80"
    depends_on:
      keycloak1:
        condition: service_healthy
      backend:
        condition: service_started

  keycloak1:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak1/realm-mdrive.json:/opt/keycloak/data/import/mdrive.json:ro
    depends_on:
      keycloak2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak2:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8080
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak2/realm-keycloak2.json:/opt/keycloak/data/import/keycloak2.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30